<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kraftbuch">
<title>Kraftbuch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <button class="icon-btn" id="backBtn" data-act="back" aria-label="Zurück" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <div class="topbar-title">
      <div class="eyebrow" id="viewEyebrow">Kraftbuch</div>
      <h1 id="viewTitle">Training</h1>
    </div>
    <button class="icon-btn" id="headBtn" data-act="settings" aria-label="Einstellungen und Sicherung">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabbar" aria-label="Bereiche">
  <div class="wrap tabbar-inner">
    <button class="tab" data-act="tab" data-tab="training">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9.5v5M6 7v10M18 7v10M21 9.5v5M6 12h12"/></svg>
      Training
    </button>
    <button class="tab" data-act="tab" data-tab="fortschritt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 19.5 9 13l4 3.5 7.5-9"/><path d="M15.5 7.5h5v5"/></svg>
      Fortschritt
    </button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="cameraFile" accept="image/*" capture="environment" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
